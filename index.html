
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KS Conexão - Link na Bio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#000000, #1a1a1a);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 2px 2px 5px #FFEB3B;
      margin-bottom: 10px;
    }

    .logo::after {
      content: '⚡';
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(3px); }
      100% { opacity: 0.3; transform: translateY(0); }
    }

    .button {
      background: #FFD700;
      color: #000;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 16px;
      width: 90%;
      max-width: 400px;
      cursor: pointer;
      box-shadow: 0 0 10px #FFD700;
      transition: all 0.3s;
    }

    .button:hover {
      background: #ffc400;
      box-shadow: 0 0 15px #ffea00;
    }

    .section-title {
      margin-top: 30px;
      font-weight: bold;
      font-size: 20px;
      color: #ffffff;
    }

    .pre-msg {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      margin-top: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="logo">KS Conexão</div>

  <p style="text-align: center;">Conectando qualidade em obras e serviços elétricos</p>

  <button class="button" onclick="openWhatsApp('Vim pelo Instagram e quero um orçamento!')">WhatsApp</button>
  <button class="button" onclick="window.open('https://ksconexao.com.br', '_blank')">Acessar Site</button>
  <button class="button" onclick="window.open('https://www.instagram.com/ksconexao', '_blank')">Instagram</button>
  <button class="button" onclick="window.open('https://www.tiktok.com/@ksconexao', '_blank')">TikTok</button>

  <div class="section-title">Mensagem rápida para orçamento</div>
  <textarea id="customMsg" class="pre-msg" rows="3" placeholder="Digite sua mensagem..."></textarea>
  <button class="button" onclick="enviarCustomMsg()">Enviar no WhatsApp</button>

  <footer>
    © 2025 KS Conexão - Todos os direitos reservados
  </footer>

  <script>
    function openWhatsApp(msg) {
      const number = "5511978121070";
      const url = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    function enviarCustomMsg() {
      const mensagem = document.getElementById("customMsg").value || "Olá! Gostaria de um orçamento.";
      openWhatsApp(mensagem);
    }
  </script>
</body>
</html>
